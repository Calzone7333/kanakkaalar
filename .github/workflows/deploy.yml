name: Deploy Full Stack (Backend + Frontend)

on:
  push:
    branches:
      - main  # deploy only when pushing to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repo
        uses: actions/checkout@v3

      ############################
      # 2️⃣ Build Backend (Spring Boot)
      ############################
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Spring Boot backend
        run: mvn clean package -f backend/pom.xml

      ############################
      # 3️⃣ Setup SSH for Deployment
      ############################
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      ############################
      # 3.1️⃣ Build Frontend (React)
      ############################
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      ############################
      # 4️⃣ Deploy Backend JAR
      ############################
      - name: Deploy Backend
        run: |
          rsync -avz --delete -e "ssh -p 19919 -o StrictHostKeyChecking=no" \
          backend/target/financial-backend-0.0.1-SNAPSHOT.jar \
          prakash@103.181.108.248:/home/prakash/apps/kanakkaalar/backend/target/

      ############################
      # 5️⃣ Deploy Frontend (dist folder)
      ############################
      - name: Deploy Frontend
        run: |
          rsync -avz --delete -e "ssh -p 19919 -o StrictHostKeyChecking=no" \
          frontend/dist/ \
          prakash@103.181.108.248:/home/prakash/apps/kanakkaalar/frontend/dist/

      ############################
      # 5.1️⃣ Copy Frontend to Apache Dir (No Password Needed)
      ############################
      - name: Copy Frontend
        run: |
          ssh -p 19919 -o StrictHostKeyChecking=no prakash@103.181.108.248 "cp -r /home/prakash/apps/kanakkaalar/frontend/dist/* /var/www/kanakkaalar/"

      ############################
      # 6️⃣ Restart Backend Application
      ############################
      - name: Restart Backend
        run: |
          ssh -p 19919 -o StrictHostKeyChecking=no prakash@103.181.108.248 << 'EOF'
            # Stop existing backend if running
            pkill -f 'financial-backend' || true
            
            # Start new backend in background
            nohup java -jar /home/prakash/apps/kanakkaalar/backend/target/financial-backend-0.0.1-SNAPSHOT.jar > /home/prakash/apps/kanakkaalar/backend/app.log 2>&1 &
          EOF


